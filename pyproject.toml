[project]
name = "stb-buddy-desktop"
version = "1.0.0"
description = "Share one STB serial console with browsers, MCP clients, scripts, and terminal programs."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Alexander Shmelev" },
]
keywords = ["serial", "uart", "set-top-box", "mcp", "terminal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: Terminals :: Serial",
]
dependencies = [
    "fastapi>=0.142,<1",
    "mcp>=2.3,<3",
    "pyserial>=3.5,<4",
    "websockets>=15",
]

[project.scripts]
stb-buddy-desktop = "stb_buddy_desktop.__main__:main"

[project.urls]
Homepage = "https://github.com/s1mb1o/stb-buddy-desktop"
Repository = "https://github.com/s1mb1o/stb-buddy-desktop"
Issues = "https://github.com/s1mb1o/stb-buddy-desktop/issues"

[dependency-groups]
dev = [
    "ruff>=0.14,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stb_buddy_desktop"]

[tool.ruff]
line-length = 120
target-version = "py312"
